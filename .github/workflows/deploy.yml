on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        run: gh repo clone ${{ github.server_url }}/${{ github.repository }} -- --branch ${{ github.ref_name }} --depth 1
      - run: ls -R
      - name: Move into project directory
        run: cd model-service
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directory
        run: mkdir output
      - name: Read data
        run: python src/read_data.py
      - name: Preprocess text
        run: python src/text_preprocessing.py
      - name: Classify text
        run: python src/text_classification.py

      - name: Release with tag
        run: gh release create ${{ github.ref_name }} ./output/**

      - name: Release with variable
        run: gh release create ${{ github.event.inputs.tag }} ./output/**
