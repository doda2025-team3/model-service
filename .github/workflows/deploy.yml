on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    steps:
      - name: Authenticate to gh
        run: gh auth login
      - name: Checkout code
        run: gh repo clone ${{ github.server.url }}/${{ github.repository }}  -b ${{ github.ref }} --single-branch

#      - name: Install Python
#        uses: actions/setup-python@v6
#        with:
#          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directory
        run: mkdir output
      - name: Read data
        run: python src/read_data.py
      - name: Preprocess text
        run: python src/text_preprocessing.py
      - name: Classify text
        run: python src/text_classification.py

      - name: Release with tag
        run: gh release create ${{ github.ref_name }} ./output/**

      - name: Release with variable
        run: gh release create ${{ github.event.inputs.tag }} ./output/**
